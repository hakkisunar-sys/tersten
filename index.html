<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1340"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Tersten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; each screen is a stack of blocks, actions pinned to the bottom of the flow. Cassette-rewind world: ink-violet tape deck, coral = record, teal = reversed, gold = forward. */
:root{
  --ink:#1b1340; --deck:#251a52; --deck2:#31256b; --line:rgba(225,214,255,.14);
  --text:#f7f2ff; --muted:#b9acdf; --rec:#ff5b4e; --rev:#2fd3c6; --fwd:#ffc94a; --ok:#4fe08a; --bad:#ff6b8a;
  --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%, #3a2a85 0%, transparent 60%);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fwd);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .t{font-family:var(--display);font-size:15px;letter-spacing:.04em;flex:1;min-width:0}
.top .t small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.02em;font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--deck);border-radius:12px;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.iconbtn.warn{border-color:var(--rec);color:var(--rec)}
svg.i{width:18px;height:18px;flex:none}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:18px;text-align:center}
.logo{font-family:var(--display);font-size:clamp(46px,15vw,70px);line-height:1;display:flex;perspective:400px;letter-spacing:.01em}
.logo span{display:inline-block;color:var(--text);animation:flip .7s cubic-bezier(.3,1.4,.5,1) both}
.logo span:nth-child(-n+4){color:var(--rec)}
.logo span:nth-child(n+5){color:var(--rev)}
@keyframes flip{from{transform:rotateY(180deg) scaleX(-1);opacity:.2}to{transform:none;opacity:1}}
.mirror{font-family:var(--display);font-size:13px;letter-spacing:.5em;color:var(--muted);opacity:.7;transform:scaleX(-1)}
.tag{color:var(--muted);max-width:30ch}

/* mode cards */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--deck);border-radius:18px;padding:14px 16px}
.mode .side{grid-row:span 3;font-family:var(--display);font-size:22px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--deck2);color:var(--fwd)}
.mode h3{font-family:var(--display);font-size:17px;font-weight:400;letter-spacing:.02em}
.mode p{color:var(--muted);font-size:14px}
.mode .meta{font-size:12px;color:var(--rev);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.mode[disabled]{opacity:.55;cursor:default}
.mode[disabled] .meta{color:var(--muted)}
.mode:not([disabled]):active{transform:scale(.99)}

/* generic blocks */
.panel{background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}

.btn{border:0;border-radius:16px;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--deck2);color:var(--text)}
.btn.main{background:var(--rec);color:#fff;box-shadow:0 6px 0 #b8382f}
.btn.main:active{transform:translateY(3px);box-shadow:0 3px 0 #b8382f}
.btn.teal{background:var(--rev);color:#0f2b2a}
.btn.ok{background:var(--ok);color:#0e2a19}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px}

.seg{display:flex;background:var(--ink);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-size:14px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--deck2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fwd);border-color:var(--fwd);color:#2b1e00}
.chip .n{opacity:.6;font-size:12px;margin-left:4px}
.field{display:flex;gap:8px;align-items:center}
.field input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 12px}
.field .x{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--muted)}
.dot-a{width:10px;height:10px;border-radius:50%;flex:none}

/* word display */
.secret{background:var(--fwd);color:#2b1e00;border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.secret .cat{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.secret .w{font-family:var(--display);font-size:clamp(26px,8.5vw,38px);line-height:1.1;overflow-wrap:anywhere}

/* clip */
.clip{display:flex;gap:12px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px}
.clip .play{width:52px;height:52px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;color:#14102b}
.clip.rev .play{background:var(--rev)} .clip.fwd .play{background:var(--fwd)} .clip.mine .play{background:var(--rec);color:#fff}
.clip .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.clip .cl{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.wavebox{position:relative;height:40px}
.wavebox canvas{width:100%;height:100%;display:block}
.wavebox .pg{position:absolute;inset:0 auto 0 0;width:0;border-right:2px solid var(--text);background:rgba(255,255,255,.08);pointer-events:none}
.clipwrap{display:flex;flex-direction:column;gap:6px}
.speed{display:flex;gap:6px;justify-content:flex-end}
.speed button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--rev);border-color:var(--rev);color:#0f2b2a}
.clip.big .play{width:68px;height:68px}
.clip.big .wavebox{height:56px}

/* recorder */
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.recbtn{display:flex;align-items:center;gap:12px;border:0;border-radius:999px;background:var(--deck2);padding:10px 22px 10px 10px;font-weight:700;font-size:16px;min-height:64px;position:relative}
.recbtn .core{width:46px;height:46px;border-radius:50%;background:var(--rec);display:grid;place-items:center;color:#fff;flex:none;transition:transform .08s}
.recbtn.on{background:var(--rec);color:#fff}
.recbtn.on .core{background:#fff;color:var(--rec)}
.rec .hint{font-size:13px;color:var(--muted);text-align:center;max-width:36ch}
.rec .t{font-variant-numeric:tabular-nums}
.busy{color:var(--muted);font-size:14px;padding:16px}

/* timer */
.timer{display:flex;align-items:center;gap:12px}
.timer .bar{flex:1;height:12px;background:var(--ink);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.timer .fill{height:100%;background:var(--rev);width:100%;transition:width .1s linear}
.timer.low .fill{background:var(--rec)}
.timer .s{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right}
.teampill{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:999px;padding:6px 12px;font-size:14px}

/* handoff */
.handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px 8px;border-radius:24px;border:2px dashed var(--line)}
.handoff .who{font-family:var(--display);font-size:clamp(28px,9vw,40px);line-height:1.1;overflow-wrap:anywhere}
.handoff p{color:var(--muted);max-width:32ch}
.handoff svg{width:56px;height:56px;color:var(--fwd)}

/* score */
.board{display:flex;flex-direction:column;gap:6px}
.board .r{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--ink)}
.board .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.board .r .p{font-family:var(--display);font-variant-numeric:tabular-nums}
.board .r.lead{box-shadow:inset 0 0 0 2px var(--fwd)}
.counter{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.06em;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px}
.scores2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scores2 .sc{border-radius:16px;padding:12px;text-align:center;background:var(--ink)}
.scores2 .sc b{display:block;font-family:var(--display);font-size:34px;font-weight:400}
.scores2 .sc span{font-size:14px;font-weight:500;overflow-wrap:anywhere}

.reslist{display:flex;flex-direction:column;gap:10px}
.res{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--ink)}
.res .h{display:flex;align-items:center;gap:8px;font-weight:700}
.res .h .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
.mk.y{background:var(--ok);color:#0e2a19} .mk.n{background:var(--deck2);color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:999px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
.note{font-size:13px;color:var(--muted);background:var(--ink);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--ink);padding:0 14px;font-size:17px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.actions2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- MODE C: broken chain ---------- */

        onSave: c => { G.word = c; G.recs.push({ by: order[0], buf: c.fwd, flip: false }); chainStep(1); } }));
  } else {
    const it = G.pool.next();

    h('div', { class: 'foot' }, h('button', { class: 'btn main wide', onclick: () => { G.start++; chainNew(); } }, 'Yeni zincir'), h('button', { class: 'btn ghost wide', onclick: goHome }, 'Ana menü')));

  form.onsubmit = e => {
    e.preventDefault();
    if (isMatch(inp.value, cur.w)) { const pts = cur.hint ? 1 : 2; G.score += pts; G.res.push(Object.assign(cur, { ok: true })); beep(1200, .12); toast('✓ ' + cur.w + '  +' + pts, 'ok'); soloNext(); }
    else { form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); inp.select(); }
  };
  const imitBox = h('div', {});
  show(topbar(G.title, G.sub()), h('div', { class: 'row' }, h('span', { class: 'counter' }, String(G.score).padStart(3, '0')), h('span', { class: 'grow muted small' }, 'puan · doğru 2, ipuçlu 1')), timerEl(),
    h('section', { class: 'panel' }, hintP, clip(reverseBuf(b), { label: 'Ters ses', tone: 'rev', big: true, auto: true }), form,
      h('div', { class: 'row' },
        h('button', { class: 'linkbtn', onclick: e => { cur.hint = true; hintP.textContent = 'Kategori: ' + it.cat + ' · ' + it.w.length + ' harf · ilk harf "' + it.w[0] + '"'; e.target.remove(); } }, 'İpucu'),
        h('button', { class: 'linkbtn', onclick: e => { e.target.remove(); imitBox.replaceChildren(recorder({ label: 'Taklit et', onDone: x => { cur.imit = x; imitBox.replaceChildren(clip(reverseBuf(x), { label: 'Taklidin düz çevrildi', tone: 'mine', auto: true })); } })); } }, 'Kendim taklit edeyim'),
        h('span', { class: 'grow' }),
        h('button', { class: 'btn ghost', onclick: () => { G.res.push(Object.assign(cur, { ok: false })); toast('Pas: ' + cur.w); soloNext(); } }, 'Pas')),
      imitBox));
  setTimeout(() => inp.focus({ preventScroll: true }), 50);
}
function soloEnd() {
  cancelRec();
  const S = load(), best = Math.max(S.best || 0, G.score), rec = G.score > (S.best || 0) && G.score > 0; save({ best });
  show(topbar(G.title, 'Süre doldu'),
    h('div', { class: 'stack', style: 'text-align:center' }, h('span', { class: 'label' }, rec ? 'Yeni rekor' : 'Puanın'), h('div', { class: 'logo', style: 'justify-content:center;font-size:64px' }, String(G.score)),
      h('p', { class: 'muted small' }, 'Rekor: ' + best)),
    G.res.length ? h('section', { class: 'panel' }, h('span', { class: 'label' }, 'Duydukların'), h('div', { class: 'reslist' }, G.res.map(r => resultRow(r, 'Taklidin, düz')))) : null,
    h('div', { class: 'foot' }, h('button', { class: 'btn main wide', onclick: () => setup('tek') }, 'Tekrar'), h('button', { class: 'btn ghost wide', onclick: goHome }, 'Ana menü')));
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T) keepAwake(); });
home();
</script>
